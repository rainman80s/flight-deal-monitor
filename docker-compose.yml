services:
  flightmon:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLIGHTMON_CONFIG: /app/config.toml
      FLIGHTMON_TRAVELERS: /app/travelers.toml
      FLIGHTMON_DB: /app/data/flightmon.sqlite3
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./travelers.toml:/app/travelers.toml:ro
      - ./data:/app/data
    expose: ["8080"]

  # Caddy gets a free HTTPS certificate automatically; Twilio requires HTTPS.
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [flightmon]

volumes:
  caddy_data:
