# Copy to config.toml and edit. Secrets (API keys, phone numbers) go in .env, not here.

[mode]
# dry_run = true: searches use the provider below, but NO calls/texts are placed
# (alerts print to the console/log) and NOTHING is ever booked.
dry_run = true
# Even with dry_run = false, booking stays off until this is true.
# When off, "buy" replies with a booking link instead of purchasing.
booking_enabled = false

[search]
# "mock" (fake fares for testing), "duffel", or "ignav" (adapter pending, see README)
provider = "mock"
origins = ["SEA", "PDX"]
currency = "USD"
cabin_class = "economy"
max_connections = 1
# How often a search cycle runs, and how many searches each cycle makes.
# Monthly request volume = searches_per_cycle * (60 / interval_minutes) * 24 * 30.
interval_minutes = 30
searches_per_cycle = 10

[rules]
# All prices are ROUND TRIP, per person, in the currency above.
domestic_max_price = 100
international_max_price = 300
min_days_out = 30          # depart at least this many days after the day the fare is found
max_days_out = 240         # don't look further out than this
min_trip_days = 2
max_trip_days = 14         # return within this many days of departure
trip_lengths_to_search = [3, 5, 7, 10, 14]

[destinations]
# Domestic vs. international is decided by which list a destination is in.
domestic = [
  "LAX", "SFO", "SAN", "LAS", "PHX", "DEN", "SLC", "ANC", "HNL", "OGG",
  "DFW", "AUS", "ORD", "MSP", "ATL", "MIA", "MCO", "BOS", "JFK", "EWR",
  "DCA", "MSY", "BNA", "SJC", "SMF", "BOI",
]
international = [
  "YVR", "MEX", "CUN", "SJD", "PVR", "GDL", "LIR", "SJO",
  "NRT", "HND", "KIX", "ICN", "TPE", "MNL", "BKK", "SIN",
  "LHR", "DUB", "KEF", "CDG", "AMS", "FRA", "MAD", "BCN", "LIS", "FCO",
  "SYD", "AKL",
]

[alerts]
timezone = "America/Los_Angeles"
# During quiet hours alerts go by text only (no phone calls).
quiet_hours_start = 22
quiet_hours_end = 8
# Re-alert on a deal you've already been told about only if it drops by at least this much.
realert_drop_percent = 10
# Avoid a phone storm when several deals land at once: the best deal(s) get a call,
# the rest are texted.
max_calls_per_cycle = 1
max_texts_per_cycle = 5
# Contacts are defined in .env as CONTACT_<NAME>_PHONE (see .env.example).
contacts = ["RAN", "BROCK"]

[booking]
# "responder": whoever says buy gets a ticket for themselves.
# "both": a buy from either person books both contacts on the same order (same flights).
mode = "responder"
# A fare may have risen since the alert; refuse to book if it rose more than this.
max_price_increase_percent = 5
# Hard cap on total spend per calendar day across all bookings.
daily_spend_cap = 700
